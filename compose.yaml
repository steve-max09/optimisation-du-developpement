---
services:
  app:
    env_file:
      - .env
    build: ./docker/php
    ports:
      - 8086:80
    depends_on:
      - db
    volumes:
      - .:/var/www/html
  db:
    image: mysql:5.7
    environment:
      - MYSQL_USER=${APP_DATABASE_USER}
      - MYSQL_PASSWORD=${APP_DATABASE_PASSWORD}
      - MYSQL_DATABASE=${APP_DATABASE_NAME}
      - MYSQL_ROOT_PASSWORD=${APP_DATABASE_ROOT_PASSWORD}
    volumes:
      - ./docker/mysql/rootfs/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - db-data:/var/lib/mysql:rw
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - 8080:80
    depends_on:
      - db
    environment:
      PMA_HOST: db

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:25.11.0.114957-community
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_bundled_plugins:/opt/sonarqube/lib/bundled-plugins

volumes:
  db-data: null
  postgres_data:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_bundled_plugins:
